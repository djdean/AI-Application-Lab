<!DOCTYPE html>
<html>
<head>
    <title>CORS Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            background-color: #f5f5f5;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <h1>FastAPI CORS Test Page</h1>
    <p>This page tests CORS functionality of your FastAPI server.</p>
    
    <h2>Test Endpoints:</h2>
    <button onclick="testCustom()">Test GET /api/custom</button>
    <button onclick="testMessage()">Test POST /api/message</button>
    <button onclick="testHistory()">Test GET /api/get_message_history</button>
    
    <div id="result"></div>

    <script>
        const API_BASE = 'http://localhost:8000';

        async function testCustom() {
            displayResult('Testing GET /api/custom...', 'info');
            try {
                const response = await fetch(`${API_BASE}/api/custom?test_message=CORS_Test`);
                const data = await response.json();
                displayResult(`✅ Success! Response: ${data.response}`, 'success');
            } catch (error) {
                displayResult(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function testMessage() {
            displayResult('Testing POST /api/message...', 'info');
            try {
                const response = await fetch(`${API_BASE}/api/message`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: 'Hello from CORS test!'
                    })
                });
                const data = await response.json();
                displayResult(`✅ Success! Response: ${data.response}`, 'success');
            } catch (error) {
                displayResult(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function testHistory() {
            displayResult('Testing GET /api/get_message_history...', 'info');
            try {
                const response = await fetch(`${API_BASE}/api/get_message_history`);
                const data = await response.json();
                displayResult(`✅ Success! History has ${data.history.length} items: ${JSON.stringify(data.history, null, 2)}`, 'success');
            } catch (error) {
                displayResult(`❌ Error: ${error.message}`, 'error');
            }
        }

        function displayResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<p class="${type}">${message}</p>`;
        }
    </script>
</body>
</html>
